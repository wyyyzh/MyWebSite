name: Deploy to GitHub Pages

# 推送到 main 分支就自动构建并发布，也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # SPA 路由兜底：GitHub Pages 遇到 /projects/xxx 这类子路由会去找
      # dist/projects/xxx/index.html，找不到就返回 404.html。
      # 把 404.html 换成 index.html 的内容，让前端路由自己接管。
      - name: 生成 SPA 404 兜底页
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
